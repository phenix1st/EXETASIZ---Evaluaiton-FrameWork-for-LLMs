[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exetasiz"
version = "0.1.0"
description = "A framework for systematically testing and comparing LLMs on the same dataset."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Exetasiz Contributors"}
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
exetasiz = "exetasiz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/exetasiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
